title: -аас
subtitle: Гарах тийн ялгал
meaning:
  en: 'ablative case: from'
  ru: 'исходный падеж: откуда?, от кого?'
level: M1
order: 6
usage:
  - Нэр үг + **-аас / -ээс / -оос / -өөс**
examples:
  - mn: Би Монгол**оос** ирсэн.
    en: I came from Mongolia.
    ru: 'Я приехал из Монголии.'
  - mn: Тэр ажл**аас** гарлаа.
    en: She left work.
    ru: 'Она ушла с работы.'
  - mn: Эмч**ээс** асуугаарай.
    en: Please ask the doctor.
    ru: 'Спросите у врача.'
explanation:
  en: |
    ## How to use

    The ablative shows **where something comes from**. It answers **хаанаас?** (from
    where?) and **хэнээс?** (from whom?).

    The suffix follows **vowel harmony** – its vowel matches the vowels of the word:

    | Үгийн эгшиг | Дагавар | Жишээ                            |
    | ----------- | ------- | -------------------------------- |
    | а, у        | -аас    | Улаанбаатар → Улаанбаатар**аас** |
    | э, ү, и     | -ээс    | эмч → эмч**ээс**                 |
    | о           | -оос    | Монгол → Монгол**оос**           |
    | ө           | -өөс    | төр → төр**өөс**                 |

    After a long vowel a **г** is added: дүү → дүү**гээс**. Comparisons with this case
    ("bigger than …") come at a later level.
  ru: |
    ## Как использовать

    Исходный падеж показывает, **откуда** что-то исходит. Он отвечает на вопросы
    **хаанаас?** (откуда?) и **хэнээс?** (от кого?).

    Суффикс подчиняется **гармонии гласных** — его гласная совпадает с гласными слова:

    | Үгийн эгшиг | Дагавар | Жишээ                            |
    | ----------- | ------- | -------------------------------- |
    | а, у        | -аас    | Улаанбаатар → Улаанбаатар**аас** |
    | э, ү, и     | -ээс    | эмч → эмч**ээс**                 |
    | о           | -оос    | Монгол → Монгол**оос**           |
    | ө           | -өөс    | төр → төр**өөс**                 |

    После долгой гласной добавляется **г**: дүү → дүү**гээс**. Сравнение с помощью этого
    падежа («больше, чем …») — на следующем уровне.

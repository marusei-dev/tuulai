title: -аар
subtitle: Үйлдэх тийн ялгал
meaning: 'instrumental case: by, with (a tool), in (a language)'
level: M1
order: 7
usage:
  - Нэр үг + **-аар / -ээр / -оор / -өөр**
examples:
  - mn: Би автобус**аар** явна.
    en: I will go by bus.
  - mn: Бид монгол**оор** ярьдаг.
    en: We speak in Mongolian.
  - mn: Үзг**ээр** бичээрэй.
    en: Please write with a pen.

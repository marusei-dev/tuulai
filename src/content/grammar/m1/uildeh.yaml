title: -аар
subtitle: Үйлдэх тийн ялгал
meaning:
  en: 'instrumental case: by, with (a tool), in (a language)'
  ru: 'орудный падеж: чем?, на чём?, на каком языке?'
level: M1
order: 7
usage:
  - Нэр үг + **-аар / -ээр / -оор / -өөр**
examples:
  - mn: Би автобус**аар** явна.
    en: I will go by bus.
    ru: 'Я поеду на автобусе.'
  - mn: Бид монгол**оор** ярьдаг.
    en: We speak in Mongolian.
    ru: 'Мы говорим по-монгольски.'
  - mn: Үзг**ээр** бичээрэй.
    en: Please write with a pen.
    ru: 'Пишите ручкой.'
explanation:
  en: |
    ## How to use

    The instrumental shows **how** or **with what** something is done. It answers
    **юугаар?** (with what? by what?).

    | Хэрэглээ  | Жишээ                                         |
    | --------- | --------------------------------------------- |
    | Transport | автобусаар – by bus                           |
    | Tool      | үзгээр – with a pen                           |
    | Language  | монголоор, англиар – in Mongolian, in English |

    The four forms follow the same vowel harmony as the ablative (-аар, -ээр, -оор,
    -өөр). After a long vowel a **г** is added: дүү → дүү**гээр**.
  ru: |
    ## Как использовать

    Орудный падеж показывает, **как** или **с помощью чего** совершается действие. Он отвечает
    на вопрос **юугаар?** (чем? на чём?).

    | Хэрэглээ   | Жишээ                                            |
    | ---------- | ------------------------------------------------ |
    | Транспорт  | автобусаар — на автобусе                         |
    | Инструмент | үзгээр — ручкой                                  |
    | Язык       | монголоор, англиар — по-монгольски, по-английски |

    Четыре формы подчиняются той же гармонии гласных, что и в исходном падеже (-аар, -ээр,
    -оор, -өөр). После долгой гласной добавляется **г**: дүү → дүү**гээр**.

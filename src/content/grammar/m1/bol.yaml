title: бол
meaning:
  en: 'links two nouns: A is B'
  ru: 'связывает два существительных: A есть B'
level: M1
order: 1
script: ᠪᠣᠯ
usage:
  - Нэр үг + бол + нэр үг
examples:
  - mn: Би бол оюутан.
    en: I am a student.
    ru: 'Я студент.'
  - mn: Энэ бол ном.
    en: This is a book.
    ru: 'Это книга.'
explanation:
  en: |
    ## How to use

    | Хэлбэр                    | Жишээ              |
    | ------------------------- | ------------------ |
    | Нэр үг + **бол** + нэр үг | Би **бол** оюутан. |

    At M1, **бол** simply links **two nouns**: _A бол B_ – "A is B". Later levels use
    **бол** in other ways too (for example to stress a topic: _би бол ингэж боддог_ –
    "as for me, I think so"), but you don't need those yet.
  ru: |
    ## Как использовать

    | Хэлбэр                    | Жишээ              |
    | ------------------------- | ------------------ |
    | Нэр үг + **бол** + нэр үг | Би **бол** оюутан. |

    На уровне M1 **бол** просто связывает **два существительных**: _A бол B_ — «A — это B».
    На следующих уровнях **бол** используется и по-другому (например, чтобы выделить тему:
    _би бол ингэж боддог_ — «что касается меня, я думаю так»), но пока это не нужно.

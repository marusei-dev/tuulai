title: -ыг / -ийг
subtitle: Заах тийн ялгал
meaning:
  en: 'accusative case: marks a definite direct object (the ~)'
  ru: 'винительный падеж: определённое прямое дополнение'
level: M1
order: 5
usage:
  - Нэр үг + **-ыг / -ийг / -г** + үйл үг
examples:
  - mn: Би энэ ном**ыг** уншсан.
    en: I read this book.
    ru: 'Я прочитал эту книгу.'
  - mn: Чи багш**ийг** таних уу?
    en: Do you know the teacher?
    ru: 'Ты знаешь учителя?'
  - mn: Тэр нохой**г** харсан.
    en: He saw the dog.
    ru: 'Он видел собаку.'
explanation:
  en: |
    ## How to use

    The accusative marks the **object** of a verb – the thing or person the action is
    done to. It answers **юуг?** (what?) and **хэнийг?** (whom?).

    Mongolian has no word for "the" or "a". Instead:

    - **with the suffix** the object is specific: _Би номыг уншсан._ – I read **the** book.
    - **without it** the object is general: _Би ном уншсан._ – I read **a** book / I did some reading.

    | Үгийн төгсгөл                        | Дагавар | Жишээ                                  |
    | ------------------------------------ | ------- | -------------------------------------- |
    | Гийгүүлэгч, эр үг (а, о, у)          | -ыг     | ном → ном**ыг**, ус → ус**ыг**         |
    | Гийгүүлэгч, эм үг; ж, ч, ш, г, ь-ээр | -ийг    | багш → багш**ийг**, ээж → ээж**ийг**   |
    | Урт эгшиг, хос эгшиг                 | -г      | ширээ → ширээ**г**, нохой → нохой**г** |
  ru: |
    ## Как использовать

    Винительный падеж обозначает **прямое дополнение** — предмет или человека, на которого
    направлено действие. Он отвечает на вопросы **юуг?** (что?) и **хэнийг?** (кого?).

    Суффикс показывает, что речь идёт о **конкретном**, уже известном предмете:

    - **с суффиксом** дополнение конкретное: _Би номыг уншсан._ — Я прочитал **эту** (ту самую) книгу.
    - **без суффикса** — общее: _Би ном уншсан._ — Я читал книгу / занимался чтением.

    | Үгийн төгсгөл                        | Дагавар | Жишээ                                  |
    | ------------------------------------ | ------- | -------------------------------------- |
    | Гийгүүлэгч, эр үг (а, о, у)          | -ыг     | ном → ном**ыг**, ус → ус**ыг**         |
    | Гийгүүлэгч, эм үг; ж, ч, ш, г, ь-ээр | -ийг    | багш → багш**ийг**, ээж → ээж**ийг**   |
    | Урт эгшиг, хос эгшиг                 | -г      | ширээ → ширээ**г**, нохой → нохой**г** |

title: -ыг / -ийг
subtitle: Заах тийн ялгал
meaning:
  en: 'accusative case: marks a definite direct object (the ~)'
  ru: 'винительный падеж: определённое прямое дополнение'
level: M1
order: 5
usage:
  - Нэр үг + **-ыг / -ийг / -г** + үйл үг
examples:
  - mn: Би энэ ном**ыг** уншсан.
    en: I read this book.
    ru: 'Я прочитал эту книгу.'
  - mn: Чи багш**ийг** таних уу?
    en: Do you know the teacher?
    ru: 'Ты знаешь учителя?'
  - mn: Тэр нохой**г** харсан.
    en: He saw the dog.
    ru: 'Он видел собаку.'

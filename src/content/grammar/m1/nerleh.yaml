title: Ø
subtitle: Нэрлэх тийн ялгал
meaning: 'nominative case: the subject of a sentence (no suffix)'
level: M1
order: 2
usage:
  - Нэр үг (дагавар авахгүй)
examples:
  - mn: '**Дорж** ирлээ.'
    en: Dorj has come.
  - mn: '**Нохой** хуцаж байна.'
    en: The dog is barking.
  - mn: '**Энэ** бол ном.'
    en: This is a book.

title: Ø
subtitle: Нэрлэх тийн ялгал
meaning:
  en: 'nominative case: the subject of a sentence (no suffix)'
  ru: 'именительный падеж: подлежащее (без суффикса)'
level: M1
order: 2
usage:
  - Нэр үг (дагавар авахгүй)
examples:
  - mn: '**Дорж** ирлээ.'
    en: Dorj has come.
    ru: 'Дорж пришёл.'
  - mn: '**Нохой** хуцаж байна.'
    en: The dog is barking.
    ru: 'Собака лает.'
  - mn: '**Энэ** бол ном.'
    en: This is a book.
    ru: 'Это книга.'

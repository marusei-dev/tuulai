title: -д / -т
subtitle: Өгөх-орших тийн ялгал
meaning:
  en: 'dative-locative case: to, for; in, at (place)'
  ru: 'дательно-местный падеж: кому?, где?'
level: M1
order: 4
usage:
  - Нэр үг + **-д / -т**
examples:
  - mn: Би гэр**т** байна.
    en: I am at home.
    ru: 'Я дома.'
  - mn: Би ах**ад** ном өглөө.
    en: I gave a book to my older brother.
    ru: 'Я дал книгу старшему брату.'
  - mn: Бид Улаанбаатар**т** амьдардаг.
    en: We live in Ulaanbaatar.
    ru: 'Мы живём в Улан-Баторе.'
explanation:
  en: |
    ## How to use

    At M1 this case has two main jobs:

    1. **Place – where?** (хаана?): _гэрт_ – at home, _сургуульд_ – at school.
    2. **Receiver – to whom?** (хэнд?): _ахад өгөх_ – to give to an older brother.

    | Үгийн төгсгөл           | Дагавар  | Жишээ                                          |
    | ----------------------- | -------- | ---------------------------------------------- |
    | Ихэнх үг                | -д       | сургууль → сургууль**д**, дүү → дүү**д**       |
    | г, р, с, в-ээр          | -т       | гэр → гэр**т**, Улаанбаатар → Улаанбаатар**т** |
    | ж, ч, ш, д, з, т, х-ээр | эгшиг+-д | ах → ах**ад**, багш → багш**ид**               |
  ru: |
    ## Как использовать

    На уровне M1 у этого падежа две основные задачи:

    1. **Место — где?** (хаана?): _гэрт_ — дома, _сургуульд_ — в школе.
    2. **Получатель — кому?** (хэнд?): _ахад өгөх_ — дать старшему брату.

    | Үгийн төгсгөл           | Дагавар  | Жишээ                                          |
    | ----------------------- | -------- | ---------------------------------------------- |
    | Ихэнх үг                | -д       | сургууль → сургууль**д**, дүү → дүү**д**       |
    | г, р, с, в-ээр          | -т       | гэр → гэр**т**, Улаанбаатар → Улаанбаатар**т** |
    | ж, ч, ш, д, з, т, х-ээр | эгшиг+-д | ах → ах**ад**, багш → багш**ид**               |

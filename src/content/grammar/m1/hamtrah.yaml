title: -тай
subtitle: Хамтрах тийн ялгал
meaning:
  en: 'comitative case: with (together), having'
  ru: 'совместный падеж: с кем?, с чем?, имеющий'
level: M1
order: 8
usage:
  - Нэр үг + **-тай / -тэй / -той**
examples:
  - mn: Би найз**тай**гаа кино үзсэн.
    en: I watched a film with my friend.
    ru: 'Я смотрел фильм со своим другом.'
  - mn: Тэр хоёр хүүхэд**тэй**.
    en: She has two children.
    ru: 'У неё двое детей.'
  - mn: Сүү**тэй** цай уух уу?
    en: Would you like tea with milk?
    ru: 'Будете чай с молоком?'
explanation:
  en: |
    ## How to use

    The comitative has two meanings at M1:

    1. **Together with**: _найзтай_ – with a friend.
    2. **Having**: _хүүхэдтэй_ – having children, _сүүтэй цай_ – tea with milk.

    | Үгийн эгшиг | Дагавар | Жишээ                |
    | ----------- | ------- | -------------------- |
    | а, у        | -тай    | найз → найз**тай**   |
    | э, ү, ө, и  | -тэй    | сүү → сүү**тэй**     |
    | о           | -той    | нохой → нохой**той** |

    In the first example the ending **-гаа** means "one's own" – you will learn it soon.
  ru: |
    ## Как использовать

    На уровне M1 у совместного падежа два значения:

    1. **Вместе с**: _найзтай_ — с другом.
    2. **Имеющий**: _хүүхэдтэй_ — с детьми (имеющий детей), _сүүтэй цай_ — чай с молоком.

    | Үгийн эгшиг | Дагавар | Жишээ                |
    | ----------- | ------- | -------------------- |
    | а, у        | -тай    | найз → найз**тай**   |
    | э, ү, ө, и  | -тэй    | сүү → сүү**тэй**     |
    | о           | -той    | нохой → нохой**той** |

    В первом примере окончание **-гаа** означает «свой» — его вы скоро изучите.

title: -ын / -ийн
subtitle: Харьяалах тийн ялгал
meaning:
  en: "genitive case: of, ~'s (possession)"
  ru: 'родительный падеж: чей?, принадлежность'
level: M1
order: 3
usage:
  - Нэр үг + **-ын / -ийн** + нэр үг
examples:
  - mn: Энэ бол багш**ийн** ном.
    en: This is the teacher's book.
    ru: 'Это книга учителя.'
  - mn: Дорж**ийн** ээж эмч.
    en: Dorj's mother is a doctor.
    ru: 'Мама Доржа — врач.'
  - mn: Бат**ын** гэр хаана байна вэ?
    en: Where is Bat's home?
    ru: 'Где дом Бата?'
explanation:
  en: |
    ## How to use

    The genitive shows **whose** something is. It answers the question **хэний?** (whose?).
    The owner takes the suffix and comes **before** the thing owned.

    | Үгийн төгсгөл                        | Дагавар | Жишээ                                    |
    | ------------------------------------ | ------- | ---------------------------------------- |
    | Гийгүүлэгч, эр үг (а, о, у)          | -ын     | ном → ном**ын**, Бат → Бат**ын**         |
    | Гийгүүлэгч, эм үг; ж, ч, ш, г, ь-ээр | -ийн    | багш → багш**ийн**, ээж → ээж**ийн**     |
    | Хос эгшиг (-ай, -ой)                 | -н      | далай → далай**н**, нохой → нохой**н**   |
    | Урт эгшиг                            | -гийн   | дүү → дүү**гийн**, Нараа → Нараа**гийн** |

    Some words have a "hidden н" and take **-ны / -ний** instead (ус → усны). You will
    learn these at a later level.
  ru: |
    ## Как использовать

    Родительный падеж показывает, **чей** предмет. Он отвечает на вопрос **хэний?** (чей?).
    Суффикс получает владелец, и он стоит **перед** тем, чем владеет.

    | Үгийн төгсгөл                        | Дагавар | Жишээ                                    |
    | ------------------------------------ | ------- | ---------------------------------------- |
    | Гийгүүлэгч, эр үг (а, о, у)          | -ын     | ном → ном**ын**, Бат → Бат**ын**         |
    | Гийгүүлэгч, эм үг; ж, ч, ш, г, ь-ээр | -ийн    | багш → багш**ийн**, ээж → ээж**ийн**     |
    | Хос эгшиг (-ай, -ой)                 | -н      | далай → далай**н**, нохой → нохой**н**   |
    | Урт эгшиг                            | -гийн   | дүү → дүү**гийн**, Нараа → Нараа**гийн** |

    У некоторых слов есть «скрытое н», и они получают **-ны / -ний** (ус → усны). Их вы
    изучите на следующем уровне.

title: руу
subtitle: Чиглэх тийн ялгал
meaning:
  en: 'directive case: towards, to (a place)'
  ru: 'направительный падеж: куда?'
level: M1
order: 9
usage:
  - Нэр үг + **руу / рүү / луу / лүү**
examples:
  - mn: Бид хот **руу** явлаа.
    en: We went to the city.
    ru: 'Мы поехали в город.'
  - mn: Тэр гэр **лүү** гүйлээ.
    en: He ran home.
    ru: 'Он побежал домой.'
  - mn: Маргааш Улаанбаатар **луу** нисэнэ.
    en: Tomorrow I fly to Ulaanbaatar.
    ru: 'Завтра я лечу в Улан-Батор.'
explanation:
  en: |
    ## How to use

    The directive shows the **direction of movement**. It answers **хаашаа?** (where to?)
    and is used with verbs like _явах_ (go), _гүйх_ (run), _нисэх_ (fly).

    It is usually written as a **separate word** after the noun.

    | Үгийн төгсгөл | Эр үг (а, о, у) | Эм үг (э, ө, ү) |
    | ------------- | --------------- | --------------- |
    | Ихэнх үг      | руу             | рүү             |
    | р-ээр         | луу             | лүү             |

    The ending changes after **р** so that two р sounds don't meet: _хот руу_, but
    _Улаанбаатар луу_, _гэр лүү_.
  ru: |
    ## Как использовать

    Направительный падеж показывает **направление движения**. Он отвечает на вопрос
    **хаашаа?** (куда?) и используется с глаголами движения: _явах_ (идти, ехать), _гүйх_
    (бежать), _нисэх_ (лететь).

    Обычно он пишется **отдельным словом** после существительного.

    | Үгийн төгсгөл | Эр үг (а, о, у) | Эм үг (э, ө, ү) |
    | ------------- | --------------- | --------------- |
    | Ихэнх үг      | руу             | рүү             |
    | р-ээр         | луу             | лүү             |

    После **р** окончание меняется, чтобы два звука «р» не стояли рядом: _хот руу_, но
    _Улаанбаатар луу_, _гэр лүү_.

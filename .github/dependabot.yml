# Weekly pull requests for outdated or vulnerable dependencies.
# CI runs on each one, and Cloudflare builds a preview for it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One pull request for all minor and patch updates instead of one per package.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
